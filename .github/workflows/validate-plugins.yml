name: Validate plugins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - "pstack/**"
      - "harness/**"
      - "scripts/**"
      - "codex/**"
      - ".github/workflows/validate-plugins.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codex-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone Codex installation
        shell: pwsh
        run: ./codex/test-sync-pstack.ps1 -SourceRoot $PWD.Path -TestRoot (Join-Path $env:RUNNER_TEMP 'pstack-codex-install')

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats fast-check@4.5.3

      - name: Run shared pstack verification
        run: node scripts/verify-pstack.mjs full
